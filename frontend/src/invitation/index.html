<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Digital | Divinos</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; }
        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #FCFBF7;
            color: #C5A059;
            font-family: 'Georgia', serif;
        }
        .heart { font-size: 3rem; animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        #error-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #FCFBF7;
            color: #4A4A4A;
            font-family: Georgia, serif;
            text-align: center;
            padding: 2rem;
        }
        #error-screen h1 { color: #C5A059; font-size: 2rem; margin-bottom: 1rem; }
        #error-screen p { max-width: 400px; color: #A1A1A1; line-height: 1.7; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="heart">♡</div>
        <p style="margin-top:1rem; font-size:1rem; letter-spacing:2px;">A carregar o convite...</p>
    </div>
    <div id="error-screen">
        <h1>Convite não encontrado</h1>
        <p>Este convite pode ter sido removido ou o link está incorreto. Verifique com quem lhe enviou.</p>
    </div>

    <!-- Supabase SDK para identificação dinâmica do template -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>

    <script>
        (async function () {
            // Extrair slug da URL — suporta /invitation/?slug=nome OU /invitation/nome
            let slug = new URLSearchParams(window.location.search).get('slug');

            if (!slug) {
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                if (pathParts.length >= 2 && pathParts[0] === 'invitation') {
                    slug = pathParts[1];
                }
            }

            if (!slug) {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('error-screen').style.display = 'flex';
                return;
            }

            // Identificação dinâmica de template configurado no Supabase
            try {
                const sb = window.supabaseClient;
                if (sb) {
                    const { data, error } = await sb
                        .from('invitations')
                        .select('editor_type, custom_html')
                        .eq('slug', slug)
                        .maybeSingle();

                    if (data && data.editor_type) {
                        const et = data.editor_type;
                        let tId = 'convite-principal';

                        if (et.includes(',')) {
                            const parts = et.split(',');
                            if (parts[2]) tId = parts[2].trim();
                        } else {
                            tId = et.trim();
                        }

                        // Roteamento específico para cada template
                        if (tId === 'premium-editorial') {
                            window.location.replace('/templates/premium-editorial.html?slug=' + encodeURIComponent(slug));
                            return;
                        } else if (tId === 'royal-luxury') {
                            window.location.replace('/templates/royal-luxury.html?slug=' + encodeURIComponent(slug));
                            return;
                        } else if (tId === 'minimalist-elegance') {
                            window.location.replace('/templates/minimalist-elegance.html?slug=' + encodeURIComponent(slug));
                            return;
                        }
                    }
                }
            } catch (err) {
                console.warn("[Router] Erro ao identificar template do convite:", err);
            }

            // Destino Oficial Padrão (convite.html - Principal Clássico)
            window.location.replace('/pages/convite.html?slug=' + encodeURIComponent(slug));
        })();
    </script>
</body>
</html>
